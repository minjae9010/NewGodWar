plugins {
    id "xyz.jpenilla.run-paper" version "3.0.2"
    id "com.gradleup.shadow" version "9.3.1"
}

dependencies {
    implementation project(":compatibility:common")
    implementation "org.bstats:bstats-bukkit:3.2.1"
    runtimeOnly project(":compatibility:reflection")
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.destroystokyo.paper:paper-api:1.12.2-R0.1-SNAPSHOT"
}

def testServerVersion = providers.gradleProperty("newGodWarMinecraftVersion").orElse("26.3")
def testServerJavaVersion = providers.gradleProperty("newGodWarServerJavaVersion")
    .map { Integer.parseInt(it) }
    .orElse(25)
def testServerDirectory = rootProject.layout.projectDirectory.dir("run")
def pluginVersion = version.toString()

tasks.named("runServer") {
    minecraftVersion(testServerVersion.get())
    runDirectory.set(testServerDirectory)
    jvmArgs("-Xmx2G")

    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testServerJavaVersion.get())
    })

    doFirst {
        def eulaFile = testServerDirectory.file("eula.txt").asFile
        eulaFile.parentFile.mkdirs()
        eulaFile.text = "# Local NewGodWar test server\n# https://aka.ms/MinecraftEULA\neula=true\n"
    }
}

tasks.processResources {
    filteringCharset = "UTF-8"
    filesMatching("plugin.yml") {
        expand(version: pluginVersion)
    }
}

tasks.jar {
    dependsOn(":compatibility:common:jar", ":compatibility:reflection:jar")

    archiveBaseName = "NewGodWar"
    archiveClassifier = "plain"
    manifest {
        attributes(
            "Built-By": "Codex",
            "Implementation-Title": rootProject.name,
            "Implementation-Version": project.version
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { artifact -> artifact.moduleVersion.id.group != "org.bstats" }
            .collect { artifact ->
                artifact.file.isDirectory() ? artifact.file : zipTree(artifact.file)
            }
    }
}

tasks.shadowJar {
    configurations = [project.configurations.runtimeClasspath]

    relocate("org.bstats", "${project.group}.libs.bstats")

    archiveBaseName = "NewGodWar"
    archiveClassifier = ""
    manifest {
        attributes(
            "Built-By": "Codex",
            "Implementation-Title": rootProject.name,
            "Implementation-Version": project.version
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("verifyShadowJarContents") {
    dependsOn("shadowJar")

    doLast {
        def archive = tasks.shadowJar.archiveFile.get().asFile
        def requiredEntries = [
            "kr/newgodwar/libs/bstats/MetricsBase.class",
            "kr/newgodwar/libs/bstats/json/JsonObjectBuilder.class",
            "kr/newgodwar/libs/bstats/json/JsonObjectBuilder\$JsonObject.class"
        ]

        def zip = new java.util.zip.ZipFile(archive)
        try {
            requiredEntries.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Missing required shaded bStats class in ${archive.name}: ${entry}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("build") {
    dependsOn("shadowJar", "verifyShadowJarContents")
}

// Isolated Paper integration fixture, never bundled in the production plugin.
sourceSets {
    recoveryRegression {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    commandRegression {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    abilityRegression {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    coreRegression {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register("abilityRegressionJar", Jar) {
    dependsOn tasks.named("abilityRegressionClasses")
    archiveFileName = "AbilityRegressionProbe.jar"
    destinationDirectory = layout.buildDirectory.dir("ability-regression")
    from sourceSets.abilityRegression.output
}

tasks.register("recoveryRegressionJar", Jar) {
    dependsOn tasks.named("recoveryRegressionClasses")
    archiveFileName = "RecoveryRegressionProbe.jar"
    destinationDirectory = layout.buildDirectory.dir("recovery-regression")
    from sourceSets.recoveryRegression.output
}

tasks.register("commandRegressionJar", Jar) {
    dependsOn tasks.named("commandRegressionClasses")
    archiveFileName = "CommandRegressionProbe.jar"
    destinationDirectory = layout.buildDirectory.dir("command-regression")
    from sourceSets.commandRegression.output
}

tasks.register("coreRegressionJar", Jar) {
    dependsOn tasks.named("coreRegressionClasses")
    archiveFileName = "CoreRegressionProbe.jar"
    destinationDirectory = layout.buildDirectory.dir("core-regression")
    from sourceSets.coreRegression.output
}

tasks.named("build") {
    dependsOn("coreRegressionJar", "abilityRegressionJar", "commandRegressionJar", "recoveryRegressionJar")
}

game:
  # Built-in game checkpoint interval; also saves on game changes and server shutdown.
  recovery-save-interval-seconds: 10
  # default: built-in core war; addon mode id: complete replacement (e.g. example_timed)
  mode: default
  min-players: 2
  friendly-fire: false
  auto-balance-teams: true
  allow-mid-join: true
  eliminated-player-action: spectator
  clear-inventory: true
  clear-inventory-on-stop: true
  give-skyblock-items: true
  skyblock-items:
    - material: LAVA_BUCKET
      amount: 2
    - material: ICE
      amount: 2
    - material: OAK_SAPLING
      legacy-material: SAPLING
      amount: 1
    - material: BONE_MEAL
      legacy-material: INK_SACK
      damage: 15
      amount: 4
    - material: CHEST
      amount: 1
    - material: COOKED_BEEF
      amount: 64
  remove-entities: true
  ignore-bed: true
  fast-start: true
  ready-countdown-seconds: 40
  fast-ready-countdown-seconds: 5
  skip-ready-countdown-seconds: 5
  select-right: true
  ability-reroll-count: 1
  reveal-abilities-on-end: true
  announce-radius: 0
  ability-roll-message: true
  ability-tick-interval-seconds: 1
  killtime-bossbar: false
  killtime-seconds: 300
  # player-combat: 유저 간 피해 차단, core-only: 유저 전투는 허용하고 코어 파괴만 차단
  killtime-mode: player-combat
  urf:
    enabled: false
    cooldown-multiplier: 0.2

world:
  autosave: true
  spawn-animals: false
  spawn-monsters: false
  difficulty: EASY
  start-time: 6000
  game-world: ""
  reset-game-world-on-stop: true
  managed-worlds: []

maps: {}

lobby:
  teleport-on-join: true
  teleport-on-game-stop: true
  location: ""

updates:
  enabled: true
  auto-download: false
  apply-without-restart: false
  apply-delay-seconds: 10
  notify-admins: true
  initial-delay-seconds: 10
  check-interval-minutes: 60
  github:
    owner: minjae9010
    repo: NewGodWar

compatibility:
  clear-teleport-invulnerability:
    enabled: true
    delay-ticks: 1
    repeat-ticks: 3
    allowed-no-damage-ticks: 0
    clear-entity-invulnerable: true

core:
  protect-diamond-from-explosion: true
  explosion-unlock-seconds: 1800
  require-empty-hand: true
  forbid-diamond-pickaxe: true
  pickaxe-unlock:
    wooden-seconds: 1500
    stone-seconds: 1500
    iron-seconds: 1500
    diamond-seconds: 1500

ui:
  resource-pack:
    # Menu icons share abilities.effects.resource-pack.url/sha1 below (Minecraft 1.14+).
    # Players who decline or cannot load the pack keep the standard, labeled menu items.
    enabled: true

abilities:
  effects:
    # Version-matched packs from this repository resoucepack/ directory. Restart after changing settings.
    resource-pack:
      enabled: true
      # auto (or empty): use the bundled version catalogue and published GitHub Raw SHA-1.
      url: 'auto'
      # Only needed when overriding url with a custom HTTP(S) download URL.
      sha1: ''
    enabled: true
    particles: true
    # 지원되는 Display API에서는 실체 오브젝트, 미지원/예산 초과 시 파티클로 자동 전환
    objects: true
    # 능력 세션별 오브젝트 조각 수 (전체 서버 상한 256, 설정 상한 96)
    object-limit: 48
    # 행동별 등장/동작/소멸, 투사체 궤적과 비행 잔상 (false면 행동 디자인은 정지 형태)
    animations: true
    sounds: true
    action-bar: true
  messages:
    # 기본: 실패·재사용·충전/모드·중요 버프·효과 시작/종료는 짧게 표시합니다.
    # 반복 발동/패시브/초 단위 카운트다운은 생략합니다. false면 상세 안내를 표시합니다.
    # 능력 발동 타이틀은 사용하지 않습니다.
    compact: true
    enabled: true
    success: true
    failure: true
    timer: true
  nasdaq:
    iron-success-percent: 25
    diamond-success-percent: 5
  voodoo:
    damage: 0.5
    hit-interval-millis: 1000
  darkness:
    incoming-damage-multiplier: 0.25

gambling:
  enabled: true
  cost:
    cobblestone: 32
  rewards:
    normal:
      - chance: 5
        material: DIAMOND
        amount: 3
        message: "&b다이아몬드 3개 당첨!"
      - chance: 15
        material: OAK_LOG
        legacy-material: LOG
        amount: 3
        message: "&6원목 3개 당첨!"
      - chance: 15
        material: BLAZE_ROD
        amount: 1
        message: "&6블레이즈 막대기 1개를 받았어요."
      - chance: 45
        material: IRON_INGOT
        amount: 3
        message: "철괴 3개를 받았어요."
      - chance: 19
        material: IRON_INGOT
        amount: 4
        message: "철괴 4개를 받았어요."
      - chance: 1
        material: DIAMOND
        amount: 22
        message: "&b대박! 다이아몬드 22개 당첨!"
scoreboard:
  enabled: true
  team-prefixes: true

blacklist:
  abilities: []

tips:
  enabled: true
  show-on-start: true
  timed:
    enabled: true
    initial-delay-seconds: 60
    interval-seconds: 180
    repeat: true
  lines:
    - "&e막대기 3개&7를 가로·세로·대각선으로 놓으면 &6블레이즈 막대기&7가 돼요."
    - "&b/a&7에서 내 능력의 사용법과 쿨타임을 볼 수 있어요."
    - "&7능력이 마음에 들면 &b/gw yes&7, 다시 뽑으려면 &b/gw no&7를 입력하세요."
    - "&7대상을 정하는 능력은 먼저 &b/x <닉네임>&7을 입력하세요."
    - "&b/gw abilities&7에서 다른 능력도 구경해 보세요."
    - "&7우리 팀의 다이아 심장이 깨지면 팀이 탈락해요. 심장을 지켜 주세요!"
    - "&7우르프가 켜져 있으면 능력을 더 자주 쓸 수 있어요."
    - "&b/도박&7에서 조약돌로 아이템을 뽑아 보세요."
    - "&b/tc&7로 팀 채팅을 켜고 끌 수 있어요."

gamerules:
  enabled: true
  restore-on-stop: true
  rules:
    keepInventory: false
    doImmediateRespawn: true
    doDaylightCycle: false
    doWeatherCycle: false
    doFireTick: false
    fire_spread_radius_around_player: 0
    naturalRegeneration: true
    locatorBar: false

teams:
  red:
    enabled: true
    display-name: "빨강"
    color: RED
  blue:
    enabled: true
    display-name: "파랑"
    color: BLUE
  green:
    enabled: true
    display-name: "초록"
    color: GREEN

spawns: {}

messages:
  prefix: "&6[신들의 전쟁]&r "
  game-start: "&e전쟁이 시작되었습니다. 각 팀의 신전을 지키고 적의 다이아 심장을 파괴하세요."
  game-stop: "&c전쟁이 종료되었습니다."
  team-eliminated: "&c{team} 팀의 다이아 심장이 파괴되었습니다."
  team-eliminated-kick: "&c{team} 팀이 탈락했습니다."
  winner: "&a{team} 팀이 신들의 전쟁에서 승리했습니다!"
  draw: "&e모든 팀의 심장이 파괴되어 무승부로 종료합니다."

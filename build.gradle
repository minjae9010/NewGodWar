plugins {
    id "base"
}

allprojects {
    group = "kr.newgodwar"
    version = "0.3.5"
    description = "Modern Gods War minigame plugin with modular compatibility support."
}

subprojects {
    if (path == ":compatibility") {
        return
    }

    apply plugin: "java"

    dependencies {
        compileOnly "com.destroystokyo.paper:paper-api:1.12.2-R0.1-SNAPSHOT"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        if (JavaVersion.current().isJava9Compatible()) {
            options.release = 8
        }
    }
}

tasks.register("pluginJar", Copy) {
    group = "build"
    description = "Builds the final NewGodWar plugin jar."
    dependsOn(":plugin:shadowJar")
    from(project(":plugin").tasks.named("shadowJar"))
    into(layout.buildDirectory.dir("libs"))
}

tasks.named("build") {
    dependsOn("pluginJar")
}

// Original menu icons and ability art share one optional pack, separate from the server JAR.
def packClasses = layout.buildDirectory.dir("pack-compiler")
tasks.register("compileResourcePack", Exec) {
    inputs.files(fileTree("scripts/effect-art") { include "*.java" })
    outputs.dir(packClasses)
    executable new File(System.getProperty("java.home"), "bin/javac").absolutePath
    doFirst {
        packClasses.get().asFile.mkdirs()
        args = ["-encoding", "UTF-8", "-d", packClasses.get().asFile.absolutePath] +
            fileTree("scripts/effect-art") { include "*.java" }.files.sort().collect { it.absolutePath }
    }
}

tasks.register("resourcePack", Exec) {
    group = "build"
    description = "Builds versioned Minecraft menu and ability packs, hashes and runtime catalogue."
    dependsOn("compileResourcePack")
    inputs.dir(packClasses)
    inputs.file("plugin/src/main/resources/effect-art.tsv")
    inputs.file("scripts/effect-art/pack-versions.tsv")
    outputs.dir(layout.buildDirectory.dir("effect-pack"))
    outputs.dir(layout.buildDirectory.dir("generated/pack-resources"))
    def packNames = file("scripts/effect-art/pack-versions.tsv").readLines("UTF-8")
        .findAll { it && !it.startsWith("#") }.collect { it.split("\\|")[0] }
    outputs.files(packNames.collectMany { name -> ["build/libs/NewGodWar-Art-${name}.zip", "build/libs/NewGodWar-Art-${name}.zip.sha1"] })
    outputs.file(layout.buildDirectory.file("libs/NewGodWar-Art-manifest.tsv"))
    executable new File(System.getProperty("java.home"), "bin/java").absolutePath
    args "-Djava.awt.headless=true", "-cp", packClasses.get().asFile.absolutePath, "BuildEffectPack", rootDir.absolutePath
}

// resourcePack is an explicit artwork maintenance task, never part of plugin releases.
